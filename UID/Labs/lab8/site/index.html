<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Lab 8</title>
</head>

<body>
    <div class="container">
        <aside class="sidebar">
            <div class="profile">
                <div class="profile-img">
                    <img src="img/profile.jpg" alt=" profile picture">
                </div>
                <div class="profile-info">
                    <p style="font-family: Arial, Helvetica, sans-serif; margin-top: 10px;">My profile</p>
                    <p>Random Dev</p>
                    <p>Random Company</p>
                </div>
            </div>
            <nav class="navigation">
                <div class="my-tasks-button">
                    <img src="img/Bookmark.svg">
                    <a>My Tasks</a>
                    <img src="img/settings.svg">
                </div>
                <div class="all-tasks-button">
                    <img src="img/menu.svg">
                    <a>All Tasks</a>
                </div>
            </nav>
            <div class="bottom-buttons">
                <div class="exit-button">
                    <img src="img/undo.svg">
                    <a>Exit</a>
                </div>
            </div>
        </aside>
        <main class="main-field">
            <header class="main-head">
                <h3>My Tasks</h3>
                <input type="text" placeholder="Search...">
            </header>
            <div class="columns">
                <div class="todo-status"></div>
                <div class="in-progress-status"></div>
                <div class="done-status"></div>

            </div>
        </main>
    </div>
</body>

</html>
