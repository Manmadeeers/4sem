<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Мой профиль</title>
    <meta name="viewport" content="width=1200">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,500,700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #edeafd;
            font-family: 'Montserrat', Arial, sans-serif;
        }

        .container {
            display: flex;
            border: 2px solid #b6cef2;
            border-radius: 20px;
            margin: 0 auto;
            margin-top: 4px;
            background: #fff;
            width: 98vw;
            max-width: 1550px;
            min-height: 98vh;
            box-sizing: border-box;
        }

        .sidebar {
            width: 260px;
            background: #2293cb;
            border-top-left-radius: 18px;
            border-bottom-left-radius: 18px;
            padding-top: 18px;
            color: #fff;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            min-height: 98vh;
        }

        .sidebar .profile-block {
            text-align: left;
            margin-left: 12px;
        }

        .sidebar .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 6px;
        }

        .sidebar .user-name {
            margin-top: 0;
            margin-bottom: 2px;
            font-weight: 500;
            font-size: 16px;
            line-height: 20px;
            color: #fff;
        }

        .sidebar .company {
            font-size: 14px;
            color: #e2eaff;
            margin-bottom: 3px;
        }

        .sidebar .menu {
            margin-top: 32px;
            flex: 1;
        }

        .sidebar .menu-item {
            display: flex;
            align-items: center;
            font-size: 21px;
            font-weight: 500;
            cursor: pointer;
            background: #2094cb;
            border-radius: 5px;
            margin: 0 0 8px 0;
            padding: 14px 19px;
            color: #fff;
            transition: background 0.2s;
        }

        .sidebar .menu-item.selected,
        .sidebar .menu-item:hover {
            background: #1f416b;
            color: #fff;
        }

        .sidebar .menu-item i {
            margin-right: 13px;
            font-size: 24px;
            display: inline-block;
            width: 28px;
            text-align: center;
        }

        .sidebar .all-tasks {
            font-size: 20px;
            font-weight: 400;
            background: none;
            margin-top: 5px;
            margin-bottom: 36px;
            color: #eff5ff;
            display: flex;
            align-items: center;
            border: none;
            padding: 8px 19px;
            cursor: pointer;
            text-align: left;
        }

        .sidebar .all-tasks i {
            margin-right: 12px;
            font-size: 25px;
            width: 28px;
            text-align: center;
        }

        .sidebar .logout {
            color: #fff;
            opacity: 0.85;
            font-size: 21px;
            margin-bottom: 10px;
            align-items: center;
            display: flex;
            cursor: pointer;
            border: none;
            background: none;
            outline: none;
            padding: 2px 16px;
        }

        .sidebar .logout i {
            margin-right: 10px;
            font-size: 22px;
        }

        /* --- Main block --- */
        .profile-main {
            display: flex;
            flex-direction: row;
            width: 100%;
            justify-content: space-between;
            padding: 24px 0 0 0;
            margin-left: 42px;
        }

        .profile-form {
            margin-top: 14px;
            margin-left: 8px;
            max-width: 520px;
            min-width: 417px;
            width: 44vw;
            flex-shrink: 0;
        }

        .profile-form h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 25px;
            margin-top: 4px;
            margin-left: 4px;
            color: #111;
        }

        .profile-form label {
            font-size: 16px;
            font-weight: 400;
            color: #1f2937;
            margin-bottom: 6px;
            margin-top: 10px;
            display: block;
        }

        .profile-form input {
            width: 100%;
            padding: 7px 13px;
            font-size: 17px;
            border: 1px solid #b5e0f8;
            border-radius: 8px;
            background: #e1f3fd;
            margin-bottom: 17px;
            outline: none;
            font-family: 'Montserrat', Arial, sans-serif;
            color: #0d2745;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .profile-form input[type="number"] {
            max-width: 56px;
            font-size: 16px;
            text-align: center;
            padding-left: 0;
            padding-right: 0;
            margin-right: 9px;
            display: inline-block;
            margin-bottom: 0;
            vertical-align: middle;
        }

        .profile-form .age-row {
            display: flex;
            align-items: center;
            margin-bottom: 18px;
        }

        .profile-avatar-block {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 12px;
        }

        .profile-avatar-block .big-avatar {
            width: 285px;
            height: 285px;
            border-radius: 50%;
            object-fit: cover;
            background: #c4c4c4;
            border: none;
            margin-bottom: 11px;
        }

        .profile-avatar-block .upload-link {
            color: #23283a;
            font-size: 15px;
            text-decoration: underline;
            cursor: pointer;
            margin-top: 7px;
            margin-bottom: 3px;
            margin-left: 21px;
            opacity: 0.7;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="profile-block">
                <img src="https://placehold.co/56x56/cccccc/ffffff.png?text=Фото" class="avatar" alt="avatar">
                <div class="user-name">Альшевская Алина</div>
                <div class="company">KOI Software</div>
            </div>
            <div class="menu">
                <div class="menu-item selected"><i>&#128278;</i>Мои задачи</div>
                <div class="all-tasks"><i>&#9776;</i>Все задачи</div>
            </div>
            <div style="flex-grow: 1"></div>
            <div class="logout"><i>&#8592;</i>Выйти</div>
        </div>
        <!-- Main -->
        <div class="profile-main">
            <form class="profile-form">
                <h1>Мой профиль</h1>
                <label for="fname">Имя</label>
                <input id="fname" value="Алина" type="text">
                <label for="lname">Фамилия</label>
                <input id="lname" value="Альшевская" type="text">
                <div class="age-row">
                    <label for="age" style="margin-bottom:0;margin-right:6px;">Возраст</label>
                    <input id="age" value="19" type="number" style="margin-bottom:0">
                </div>
                <label for="phone">Номер телефона</label>
                <input id="phone" value="+375291773456" type="text">
                <label for="email">Email</label>
                <input id="email" value="Alina@gmail.com" type="email">
                <label for="company">Название компании</label>
                <input id="company" value="KOI Software" type="text">
                <label for="job">Должность</label>
                <input id="job" value="Дизайнер" type="text">
            </form>
            <div class="profile-avatar-block">
                <img class="big-avatar"
                    src="https://images.pexels.com/photos/415829/pexels-photo-415829.jpeg?h=400&w=400&auto=compress&fit=crop"
                    alt="profile">
                <div class="upload-link">Загрузить фото</div>
            </div>
        </div>
    </div>
</body>

</html>
